name: Mise à jour des matchs

on:
  schedule:
    # Week-end (samedi, dimanche) et lundi : toutes les 3 h, les jours de match et le lendemain
    - cron: '0 */3 * * 6,0,1'
    # Mardi à vendredi : une seule fois par jour, à 6 h UTC
    - cron: '0 6 * * 2-5'
    # Lundi matin (5 h UTC, soit 6 h ou 7 h à Paris) : le calendrier passe à la nouvelle semaine
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-matches.mjs
      - name: Commit si changement
        run: |
          git config user.name "hbcr-bot"
          git config user.email "hbcr-bot@users.noreply.github.com"
          git add data assets/clubs
          git diff --cached --quiet && exit 0
          git commit -m "Mise à jour des matchs"
          git push
